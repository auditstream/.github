name: Reusable zizmor

on:
  workflow_call:
    inputs:
      advanced-security:
        description: Upload SARIF results to GitHub Advanced Security (set false for private repos without GHAS)
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor workflow security audit
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          # Fork PRs receive a read-only GITHUB_TOKEN; fall back to annotations there or when GHAS is disabled.
          advanced-security: ${{ inputs.advanced-security && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          annotations: ${{ !inputs.advanced-security || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
